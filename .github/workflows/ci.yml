# Continuous integration (S2-8, S3-9): every PR and every push to main must
# pass before it can be merged and deployed. No secrets: the tests use fakes.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      # Actions are pinned by commit SHA so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  app:
    name: App
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # The version the app is developed with; update it on purpose.
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      # integration_test/ needs an emulator and the backend, so it stays manual.
      - run: flutter test

  database:
    name: Database
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start Postgres with the schema
        # The image comes from docker-compose.yml, so the CI tests the version
        # Dependabot proposes. The schema runs once on first start.
        run: |
          image=$(yq ".services.db.image" docker-compose.yml)
          echo "Database image: $image"
          docker run -d --name db -e POSTGRES_PASSWORD=ci-only \
            -v "$PWD/docs/schema.sql:/docker-entrypoint-initdb.d/zz-marlix-schema.sql:ro" \
            "$image"
      - name: Wait for the database
        # The image restarts Postgres after the init scripts; wait for that
        # restart, not just the first connection.
        run: |
          for attempt in $(seq 1 90); do
            if docker logs db 2>&1 | grep -q "init process complete" &&
              docker exec db pg_isready -U postgres -h localhost > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs db
          exit 1
      - name: Run the privilege and RLS tests
        run: >-
          docker exec -i db psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f -
          < docs/schema-test.sql
      - name: Check that the migrations are all reflected in the schema
        # The same query that is run in production (S6-16): none may be MISSING.
        run: |
          docker exec -i db psql -U postgres -d postgres -tA -v ON_ERROR_STOP=1 -f - \
            < docs/verify-migrations.sql | tee verification.txt
          ! grep -q '^MISSING' verification.txt
