# Local database for development (S0-13). Production runs on Supabase cloud.
#
#   docker compose up -d     start the database and pgAdmin
#   docker compose down      stop them (data is kept)
#   docker compose down -v   stop them and delete the data (fresh start)
#
# Values come from .env (copy .env.example). See README → Local database.

name: marlix

services:
  db:
    # Supabase's own Postgres image: same as production, with the `auth`
    # schema (auth.users, auth.uid()) and the anon/authenticated/service_role
    # roles that docs/schema.sql needs. A plain `postgres` image lacks them.
    # The CI reads this line, so the version Dependabot bumps is the one tested.
    # Pinned by digest: a tag can be republished, a digest cannot (S3-7).
    # Dependabot updates the tag and the digest together.
    image: supabase/postgres:17.11.0.007@sha256:b0463b9ab930a3535478d529b915d37def49d5a8fb0cb1927929e96af992b519
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Only reachable from this computer.
      - "127.0.0.1:${DB_PORT:-54322}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once, on the first start with an empty volume, after the image's
      # own setup scripts (files run in alphabetical order).
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/zz-marlix-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30

  pgadmin:
    # Exact version and digest, so every machine runs the same pgAdmin.
    image: dpage/pgadmin4:9.18.0@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # Registers the marlix database in pgAdmin on first start.
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  pgadmin-data:
