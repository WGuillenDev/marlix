name: marlix
description: "Conversational companionship app with an AI avatar."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  audioplayers: ^6.8.1
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.1
  flutter_tts: ^4.2.5
  http: ^1.6.0
  path_provider: ^2.1.6
  permission_handler: ^12.0.1
  record: ^7.1.2
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  # Unofficial port of Supertonic 3 (S6-1): pinned, so a new version is a decision.
  supertonic_flutter: 2.0.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  vad_plus: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Prototype from S0-5 (docs/diagrams/wireframes/style-guide/avatar.png)
    # until the final artwork (S5-1).
    - assets/avatar/marlix.png
    - assets/avatar/marlix-happy.png
    # Layers of the final artwork (S5-1), stacked by the avatar widget (S5-2).
    - assets/avatars/marlix/
    # Days and texts of the inactivity reminders (S5-3).
    - assets/config/reminders.json
    # Which voice model the app downloads, pinned to one revision, and its hashes (S6-2).
    - assets/config/voice-model.json

  # Bundled, not fetched at runtime. OFL licenses are next to the files.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    - family: Baloo 2
      fonts:
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
